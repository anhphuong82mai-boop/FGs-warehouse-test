<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FG Warehouse Online Test</title><style>body{font-family:Arial;margin:0;background:#edf2f7;color:#17202a}.app{max-width:1000px;margin:auto;background:white}header{background:#11283d;color:white;padding:22px}h1{margin:0}.bar{background:#16824b;color:white;padding:10px 22px;font-weight:bold}main{padding:20px}.meta{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #9aa9b8;border-radius:6px}.q{border:1px solid #d7dee7;border-radius:9px;padding:15px;margin:12px 0}label.opt{display:block;padding:8px}.timer{float:right;background:#d9363e;padding:9px 15px;border-radius:8px;font-size:24px}button{padding:12px 18px;border:0;border-radius:7px;background:#155eaa;color:white;font-weight:bold;margin:8px}.result{padding:18px;border:2px solid;margin-top:16px;border-radius:8px}.pass{border-color:#16824b;background:#edfff4}.fail{border-color:#d9363e;background:#fff1f2}.note{background:#eef5ff;padding:10px;border-radius:7px;margin-top:10px}@media(max-width:700px){.meta{grid-template-columns:1fr}}</style></head><body><div class="app"><header><div class="timer" id="timer">20:00</div><h1>FG WAREHOUSE ONLINE TEST</h1><div>WI-144 Receiving & Delivering Process at FGs WH<br>WI-779 Labeling as per customer requirement</div></header><div class="bar">20 phút • 1 đáp án/câu • PASS ≥ 80%</div><main><div class="meta"><input id="name" placeholder="Họ và tên"><input id="id" placeholder="Mã nhân viên"><input id="date" type="date"></div><div id="qs"></div><div class="q"><b>Câu 20. Điền các số SERI cho phù hợp.</b><textarea id="serial" placeholder="Nhập câu trả lời..."></textarea></div><div style="text-align:center"><button id="submit">NỘP BÀI</button></div><div id="result"></div></main></div><script>const Q=[{"q": "FIFO (First In First Out / First Expired First Out) là gì?", "o": ["Vào trước xuất sau", "Vào sau xuất trước", "Vào trước - xuất trước, vào sau - xuất sau / Hết hạn sử dụng trước - xuất trước, tới hạn sau - xuất sau", "Vào trước xuất sau và vào sau xuất trước"], "a": "C"}, {"q": "Khi nhận hàng từ khu vực sản xuất xong thì nhân viên kho phải làm gì?", "o": ["Lưu trữ ở nhiều kệ khác nhau miễn là còn chỗ trống", "Lưu trữ nhiều mã khác nhau tại cùng một vị trí và không cần định danh mã sản phẩm", "Lưu trữ đúng kệ đã set up trước đó và có định danh rõ ràng cho từng mã sản phẩm", "Không cần phải để vật tư vào kệ"], "a": "C"}, {"q": "Khi nào thì cần đóng mộc xác nhận số lượng trên hộp?", "o": ["Chỉ khi lưu trữ vật tư ở kho", "Chỉ khi xuất bán", "Tất cả A, B đều đúng"], "a": "C"}, {"q": "Nhóm sản phẩm nào của khách hàng US cần dán nhãn Made in Vietnam?", "o": ["Nhóm sản phẩm BTE 050*", "Nhóm sản phẩm xR 054*", "Nhóm sản phẩm FM 076*, 119*, 075*", "Đáp án A và C"], "a": "D"}, {"q": "Khi có sai lệch số lượng so với picking list thì nhóm packer cần phải làm gì?", "o": ["Tự vào kệ lấy thêm số lượng cho đúng với packing list", "Không cần thông tin lại và bỏ hàng vào thùng", "Thông tin lại nhóm picker kiểm tra việc dư/thiếu; chỉ tiếp tục đóng hàng sau khi có xác nhận", "Cả A, B, C đều đúng"], "a": "C"}, {"q": "Khi nhận hàng từ khu vực chờ của nhóm picker thì nhóm packer cần phải làm gì?", "o": ["Kiểm tra có đủ vật tư như packing list không", "Kiểm tra nhãn bên trong và bên ngoài phải trùng khớp", "Thao tác trên máy Murphy để packing từng vật tư và tick vào packing list sau mỗi thao tác", "Tất cả A, B, C đều đúng"], "a": "D"}, {"q": "Những khách hàng nào cần quấn màng co từng thùng carton?", "o": ["Sonova Polska Sp. z o.o.", "Sonova AG (1500) / DC", "Sonova Hearing India Pvt. Ltd.", "Đáp án A và C"], "a": "D"}, {"q": "Forwarder UPS cần những loại nhãn nào khi xuất đi?", "o": ["Must Go", "Critical", "Đáp án A và B đều đúng", "Đáp án A và B đều sai"], "a": "C"}, {"q": "Nhân viên kho khi dán AWB cần phải chú ý những điều kiện gì?", "o": ["Phải đúng số Group", "Phải đúng tên khách hàng", "Phải đúng số kiện trên AWB", "Tất cả các câu trên đều đúng"], "a": "D"}, {"q": "Sau khi kiểm tra hàng đầy đủ, hàng sẽ được chất lên kệ và lấy ra kệ như thế nào?", "o": ["Chất vào bên phải, lấy ra bên trái", "Chất vào bên trong, lấy ra bên ngoài", "Chất vào bên dưới, lấy ra bên trên", "Tất cả các câu trên đều đúng"], "a": "D"}, {"q": "Trong SAP có T-code ZMOB - Mobile Data Maintenance Phonak, cần chọn Group HU nào?", "o": ["Pick direct", "Pick selection", "Load direct", "Correct HU"], "a": "A"}, {"q": "Khi pick & pack xong một delivery, vào transaction nào để xem hàng đã trừ stock chưa?", "o": ["MB51", "MB52", "IQ03", "CO03"], "a": "B"}, {"q": "Để Goods Receipt order, vào transaction nào sau đây?", "o": ["MMBE", "SQ01", "MIGO", "VL02L"], "a": "C"}, {"q": "Tài liệu nào có liên quan đến WI ở kho?", "o": ["SOP-164 Material-Finished Goods Handling and Storage", "WI-144 Receiving and Delivering Process at FGs WH", "WI-262 Murphy to pick and pack materials and FGs", "WI-779 Labeling as per customer requirement", "Tất cả các câu trên đều đúng"], "a": "E"}, {"q": "Đối với sản phẩm có serial number trên hộp thì phải quét Murphy như thế nào?", "o": ["Quét tên sản phẩm và serial number từ số nhỏ đến số lớn", "Quét tên sản phẩm và serial number từ số lớn đến số nhỏ", "Chỉ quét tên sản phẩm", "Chỉ quét số nhỏ, không quét số lớn"], "a": "A"}, {"q": "Chọn câu trả lời không đúng trong quy trình Pick tại kho thành phẩm.", "o": ["Picker soạn hàng dựa theo picking list in từ VL06L", "Picker kiểm tra mã hàng hóa và số lượng theo picking list", "Picker bảo đảm không có bất kỳ sai lệch nào", "Được phép viết tay số lượng cho vật tư và thành phẩm đang lưu trữ", "Picker soạn hàng dựa theo picking list in từ VL10"], "a": "D"}, {"q": "Chọn câu trả lời không đúng trong quy trình Pack tại kho thành phẩm.", "o": ["Packer nhận hàng từ khu vực chờ trên trolley và quét mã delivery", "Packer kiểm tra mã hàng hóa và số lượng theo packing list", "Khi sai lệch, Packer phản hồi nhóm Picker và quản lý kho; Picker xử lý sai lệch", "Nếu sản phẩm yêu cầu serial, Packer quét serial theo WI-262 mục 4.1.2", "Packer không cần kiểm tra mã hàng hóa và số lượng theo packing list"], "a": "E"}, {"q": "Quy trình nhận và lưu trữ hàng thành phẩm cần lưu ý gì trước khi Goods Receipt?", "o": ["Kiểm tra ngoại quan sản phẩm", "Kiểm tra số lượng trên nhãn và thực tế", "Kiểm tra FIFO", "Tất cả các câu trên đều đúng"], "a": "D"}, {"q": "Những khách hàng/nước nào cần dán nhãn Made in VN?", "o": ["Advanced Bionics LLC (AB-LLC)", "Sonova Duyu Sistemleri (Turkey)", "Sonova USA (AODC)", "Tất cả các câu trên đều đúng"], "a": "D"}];const box=document.getElementById('qs');Q.forEach((x,i)=>{let d=document.createElement('div');d.className='q';d.innerHTML='<b>Câu '+(i+1)+'. '+x.q+'</b>'+x.o.map((z,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+String.fromCharCode(65+j)+'"> '+String.fromCharCode(65+j)+'. '+z+'</label>').join('');box.appendChild(d)});document.getElementById('date').value=new Date().toISOString().slice(0,10);let sec=1200,done=false;setInterval(()=>{if(done)return;if(--sec<0)return;document.getElementById('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(sec===0)submit(true)},1000);function csv(name,id,score,pct,pass,wrong){const now=new Date(),pad=n=>String(n).padStart(2,'0'),stamp=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`,esc=v=>'"'+String(v).replace(/"/g,'""')+'"',serial=document.getElementById('serial').value;let row=['Employee Name','Employee ID','Exam Name','Test Date','Submitted At','Score','Total MCQ','Percentage','Result','Wrong Questions','Question 20'].join(',')+'\n'+[esc(name),esc(id),esc('WI-144 & WI-779'),esc(document.getElementById('date').value),esc(now.toLocaleString('vi-VN')),score,Q.length,pct,esc(pass?'PASS':'FAIL'),esc(wrong.join('; ')),esc(serial)].join(',');let b=new Blob(['\ufeff'+row],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`FG_Test_${id}_${stamp}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function submit(auto=false){if(done)return;let name=document.getElementById('name').value.trim(),id=document.getElementById('id').value.trim();if(!name||!id){alert('Vui lòng nhập Họ tên và Mã nhân viên');return}let score=0,wrong=[];Q.forEach((x,i)=>{let s=document.querySelector('input[name=q'+i+']:checked');if(s&&s.value===x.a)score++;else wrong.push(i+1)});let pct=Math.round(score/Q.length*100),pass=pct>=80;done=true;let r=document.getElementById('result');r.className='result '+(pass?'pass':'fail');r.innerHTML='<h2>'+(auto?'HẾT GIỜ - BÀI ĐÃ NỘP':'KẾT QUẢ')+'</h2><b>'+name+' • '+id+'</b><h2>'+score+'/'+Q.length+' • '+pct+'% • '+(pass?'PASS':'FAIL')+'</h2><div>Câu sai/chưa trả lời: '+(wrong.join(', ')||'Không có')+'</div><div class="note">CSV đã tự tải xuống. Hãy lưu/chuyển file vào OneDrive\FG Warehouse Exam Results.</div><button id="again">TẢI LẠI CSV</button>';document.getElementById('again').onclick=()=>csv(name,id,score,pct,pass,wrong);csv(name,id,score,pct,pass,wrong)}document.getElementById('submit').onclick=()=>submit(false);</script></body></html>
