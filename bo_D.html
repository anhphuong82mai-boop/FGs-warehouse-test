<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FG Warehouse Online Test</title><style>
body{font-family:Arial;margin:0;background:#edf2f7;color:#17202a}.app{max-width:1000px;margin:auto;background:white}header{background:#11283d;color:white;padding:22px}h1{margin:0}.bar{background:#16824b;color:white;padding:10px 22px;font-weight:bold}main{padding:20px}.meta{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #9aa9b8;border-radius:6px}.q{border:1px solid #d7dee7;border-radius:9px;padding:15px;margin:12px 0}label.opt{display:block;padding:8px}.timer{float:right;background:#d9363e;padding:9px 15px;border-radius:8px;font-size:24px}button{padding:12px 18px;border:0;border-radius:7px;background:#155eaa;color:white;font-weight:bold;margin:8px;cursor:pointer}.pdf{background:#b42318}.result{padding:18px;border:2px solid;margin-top:16px;border-radius:8px}.pass{border-color:#16824b;background:#edfff4}.fail{border-color:#d9363e;background:#fff1f2}.note{background:#eef5ff;padding:10px;border-radius:7px;margin-top:10px}.print-sheet{display:none}
@media(max-width:700px){.meta{grid-template-columns:1fr}}
@media print{@page{size:A4;margin:15mm}body{background:#fff}.app{display:none!important}.print-sheet{display:block!important;color:#111;font-family:Arial}.print-title{text-align:center;border-bottom:3px solid #11283d;padding-bottom:12px;margin-bottom:18px}.print-title h1{font-size:22px}.print-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 26px;font-size:13px}.print-result{margin:18px 0;padding:16px;border:2px solid #222;text-align:center;font-size:21px;font-weight:bold}.print-row{margin:9px 0;font-size:13px}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-top:55px;text-align:center;font-size:13px}.no-print{display:none!important}}
</style>
<style id="radio-front-style">
.opt{display:flex!important;align-items:flex-start!important;gap:10px!important;cursor:pointer!important;padding:10px 8px!important}
.opt input[type="radio"]{order:-1!important;flex:0 0 auto!important;width:20px!important;height:20px!important;margin:1px 0 0 0!important;accent-color:#087f4f}
</style>
<style>.meta select{padding:10px;border:1px solid #bbb;border-radius:8px;font-size:16px;background:#fff}</style></head><body><div class="app"><header><div class="timer" id="timer">18:00</div><h1>FG WAREHOUSE ONLINE TEST - BỘ D</h1><div>WI-144 Receiving & Delivering Process at FGs WH<br>WI-779 Labeling as per customer requirement<br>WI-773 Checking Packaging and Exporting Finished Goods</div></header><div class="bar">18 phút • 1 đáp án/câu • PASS > 85%</div><main><div class="meta"><select id="employeeSelect" aria-label="Chọn Họ và tên"><option value="">-- Chọn Họ và tên --</option><option value="182728">NGUYỄN QUỐC HÙNG</option><option value="193227">VÕ THANH PHONG</option><option value="193195">HUỲNH VĂN DỦ LƯƠNG</option><option value="213540">CHUNG QUỐC HẢI</option><option value="193156">NGUYỄN MINH CHÂU</option><option value="110980">NGUYỄN NHẬT THIỆN</option><option value="182693">NGUYỄN THỊ KIM YẾN</option><option value="192904">NGUYỄN THỊ CẨM THU</option><option value="193047">NGUYỄN VĂN TIỀN</option><option value="264223">PHAN GIA TỶ</option><option value="223681">LÊ VĂN HOÀNG ANH</option><option value="203432">VƯƠNG THỊ ÁNH NGUYỆT</option><option value="264222">TẠ TRỌNG PHÚC</option><option value="253956">LƯU HẢI THỌ</option><option value="264232">TẠ HOÀI NHÂN</option></select><input id="name" type="hidden"><input id="id" placeholder="Mã nhân viên" readonly><input id="date" type="date"></div><div id="qs"></div><div style="text-align:center"><button id="submit">NỘP BÀI</button></div><div id="result"></div></main></div><section class="print-sheet" id="printSheet"></section><script>
const Q=[{"q":"Theo WI-779 Version 2, Lyric label phải được dán ở đâu?","o":["Mặt sau hộp","Mặt trước hộp, phía dưới logo Phonak Life is on","Mặt đáy hộp","Bất kỳ vị trí nào"],"a":"B"},{"q":"Khi dán Lyric label ở mặt trước hộp, nhãn phải đảm bảo điều kiện nào?","o":["Che logo Phonak Life is on","Che thông tin The world’s first 100% invisible, extended wear hearing aid.","Che serial number","Không được che bất kỳ thông tin nào"],"a":"B"},{"q":"Quality certificate của Lyric xuất Shanghai phải điền như thế nào?","o":["Dòng trên tên người thực hiện, dòng dưới ngày thực hiện","Dòng trên ngày, dòng dưới mã nhân viên","Chỉ ghi ngày","Không cần điền"],"a":"A"},{"q":"Đối với Sonova Taiwan Pte Ltd., loại nhãn nào được yêu cầu?","o":["Product label và license label","FDA label và brochure","Lyric label và quality certificate","Chỉ Made in Vietnam"],"a":"A"},{"q":"Product label cho Taiwan phải được dán ở đâu?","o":["Góc phải phía trên","Chính giữa mặt trước","Góc trái bên dưới của mặt đáy hộp","Bất kỳ vị trí nào"],"a":"C"},{"q":"FIFO (First In First Out / First Expired First Out) là gì?","o":["Vào trước xuất sau","Vào sau xuất trước","Vào trước - xuất trước, vào sau - xuất sau / Hết hạn sử dụng trước - xuất trước, tới hạn sau - xuất sau","Vào trước xuất sau và vào sau xuất trước"],"a":"C"},{"q":"Khi nhận hàng từ khu vực sản xuất xong thì nhân viên kho phải làm gì?","o":["Lưu trữ ở nhiều kệ khác nhau miễn là còn chỗ trống","Lưu trữ nhiều mã khác nhau tại cùng một vị trí và không cần định danh mã sản phẩm","Lưu trữ đúng kệ đã set up trước đó và có định danh rõ ràng cho từng mã sản phẩm","Không cần phải để vật tư vào kệ"],"a":"C"},{"q":"Đóng gói sản phẩm Lyric một Group cần bao nhiêu cái data Logger?","o":["Chỉ 1 cái","Cần 2 cái","Mỗi thùng 1 cái","Không cần có cũng được"],"a":"A"},{"q":"Khi có sai lệch số lượng so với picking list thì nhóm packer cần phải làm gì?","o":["Tự vào kệ lấy thêm số lượng cho đúng","Không cần thông tin lại và bỏ hàng vào thùng","Thông tin lại nhóm picker kiểm tra việc dư/thiếu; sau khi xác nhận mới tiếp tục đóng hàng","Cả A, B, C đều đúng"],"a":"C"},{"q":"Khi nhận hàng từ khu vực chờ của nhóm picker thì nhóm packer cần phải làm gì?","o":["Kiểm tra có đủ vật tư như packing list không","Kiểm tra nhãn bên trong và bên ngoài phải trùng khớp","Thao tác trên máy Murphy để packing từng vật tư và tick vào packing list","Tất cả A, B, C đều đúng"],"a":"D"},{"q":"Sau khi kiểm tra hàng đầy đủ, hàng sẽ được chất lên kệ và lấy ra kệ như thế nào?","o":["Chất vào bên phải, lấy ra bên trái","Chất vào bên trong, lấy ra bên ngoài","Chất vào bên dưới, lấy ra bên trên","Tất cả các câu trên đều đúng"],"a":"D"},{"q":"Trong SAP có tcode ZMOB - Mobile Data Maintenance Phonak, cần chọn Group HU nào?","o":["Pick direct","Pick selection","Load direct","Correct HU"],"a":"C"},{"q":"Khi pick & pack xong một delivery, vào transaction nào xem hàng đã trừ stock chưa?","o":["MB51","MB52","IQ03","CO03"],"a":"A"},{"q":"Để goods receipt order vào transaction nào sau đây?","o":["MMBE","SQ01","MIGO","VL02L"],"a":"C"},{"q":"Đối với sản phẩm có serial number trên hộp thì phải quét Murphy như thế nào?","o":["Quét tên sản phẩm và serial number từ số nhỏ đến số lớn","Quét tên sản phẩm và serial number từ số lớn đến số nhỏ","Chỉ quét tên sản phẩm","Chỉ quét số nhỏ không quét số lớn"],"a":"A"},{"q":"Ký hiệu [vn] trên picking list yêu cầu nhân viên làm gì?","o":["Dán FDA label","Thêm brochure","Dán Made in Vietnam lên hộp","Dán chấm xanh"],"a":"C"},{"q":"Khi picking list xuất hiện code brochure, nhân viên phải làm gì?","o":["Dán brochure bên ngoài hộp","Đưa brochure vào bên trong hộp và sau khi hoàn thành đóng mộc Brochure cùng tên người thực hiện","Dán chấm xanh, không cần brochure","Chuyển trực tiếp cho Packing"],"a":"B"},{"q":"Khi picking list có code FDA label, thao tác đúng là gì?","o":["Bỏ FDA label vào trong hộp","Dán FDA label lên hộp và sau khi hoàn thành đóng mộc FDA label cùng tên người thực hiện","Chỉ kiểm tra label","Dán FDA label lên master carton"],"a":"B"},{"q":"Trước khi chuyển hàng cho nhóm Packing, nhân viên cần làm gì?","o":["Chỉ kiểm tra số lượng","Chỉ kiểm tra Made in Vietnam","Kiểm tra tổng thể tất cả các bước được yêu cầu trên picking list","Không cần kiểm tra lại"],"a":"C"},{"q":"Đối với Lyric xuất cho Sonova (Shanghai) Co. Ltd., yêu cầu gồm những gì?","o":["Lyric label","Instructional brochure","Quality certificate","Tất cả A, B, C"],"a":"D"}];const box=document.getElementById('qs');Q.forEach((x,i)=>{let d=document.createElement('div');d.className='q';d.innerHTML='<b>Câu '+(i+1)+'. '+x.q+'</b>'+x.o.map((z,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+String.fromCharCode(65+j)+'"> '+String.fromCharCode(65+j)+'. '+z+'</label>').join('');box.appendChild(d)});const employeeSelect=document.getElementById('employeeSelect');employeeSelect.addEventListener('change',()=>{const opt=employeeSelect.options[employeeSelect.selectedIndex];document.getElementById('name').value=opt&&opt.value?opt.text:'';document.getElementById('id').value=opt?opt.value:'';});document.getElementById('date').value=new Date().toISOString().slice(0,10);let sec=1080,done=false;setInterval(()=>{if(done)return;if(--sec<0)return;document.getElementById('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(sec===0)submit(true)},1000);
const esc=v=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function csv(name,id,score,pct,pass,wrong){const now=new Date(),pad=n=>String(n).padStart(2,'0'),stamp=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`,e=v=>'"'+String(v).replace(/"/g,'""')+'"';let row=['Employee Name','Employee ID','Exam Name','Test Date','Submitted At','Score','Total MCQ','Percentage','Result','Wrong Questions'].join(',')+'\n'+[e(name),e(id),e('WI-144 & WI-779 & WI-773 - BỘ D'),e(document.getElementById('date').value),e(now.toLocaleString('vi-VN')),score,Q.length,pct,e(pass?'PASS':'FAIL'),e(wrong.join('; '))].join(',');let b=new Blob(['﻿'+row],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`FG_Test_${id}_${stamp}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function preparePDF(name,id,score,pct,pass,wrong){
 const now=new Date(),date=document.getElementById('date').value,letters=['A','B','C','D'];
 let details=Q.map((x,i)=>{
  const selected=document.querySelector('input[name=q'+i+']:checked');
  const chosen=selected?selected.value:'';
  const chosenIndex=letters.indexOf(chosen),correctIndex=letters.indexOf(x.a);
  const chosenText=chosenIndex>=0?chosen+'. '+x.o[chosenIndex]:'Chưa trả lời';
  const correctText=correctIndex>=0?x.a+'. '+x.o[correctIndex]:x.a;
  const ok=chosen===x.a;
  return `<div style="margin:12px 0;padding:10px;border:1px solid #bbb;border-radius:6px;page-break-inside:avoid">
   <div style="font-weight:700">Câu ${i+1}: ${esc(x.q)}</div>
   <div><b>Nhân viên chọn:</b> ${esc(chosenText)}</div>
   <div><b>Đáp án đúng:</b> ${esc(correctText)}</div>
   <div><b>Kết quả:</b> ${ok?'ĐÚNG':'SAI'}</div>
  </div>`
 }).join('');
 document.getElementById('printSheet').innerHTML=`<div class="print-title"><h1>FG WAREHOUSE - PHIẾU KẾT QUẢ KIỂM TRA</h1><div>WI-144 Receiving & Delivering Process at FGs WH</div><div>WI-779 Labeling as per customer requirement<br>WI-773 Checking Packaging and Exporting Finished Goods</div></div><div class="print-grid"><div><b>Họ và tên:</b> ${esc(name)}</div><div><b>Mã nhân viên:</b> ${esc(id)}</div><div><b>Ngày kiểm tra:</b> ${esc(date)}</div><div><b>Thời gian nộp:</b> ${esc(now.toLocaleString('vi-VN'))}</div></div><div class="print-result">${score}/${Q.length} câu &nbsp; | &nbsp; ${pct}% &nbsp; | &nbsp; ${pass?'PASS':'FAIL'}</div><div class="print-row"><b>Ngưỡng đạt:</b> >85%</div><div class="print-row"><b>Câu sai/chưa trả lời:</b> ${wrong.length?wrong.join(', '):'Không có'}</div><h2 style="margin-top:22px">CHI TIẾT 20 CÂU HỎI VÀ CÂU TRẢ LỜI</h2>${details}<div class="signatures"><div>Nhân viên<br><br><br>________________________</div><div>Người xác nhận<br><br><br>________________________</div></div>`
}
function savePDF(){window.print()}
function submit(auto=false){if(done)return;let name=document.getElementById('name').value.trim(),id=document.getElementById('id').value.trim();if(!name||!id){alert('Vui lòng nhập Họ tên và Mã nhân viên');return}let score=0,wrong=[];Q.forEach((x,i)=>{let s=document.querySelector('input[name=q'+i+']:checked');if(s&&s.value===x.a)score++;else wrong.push(i+1)});let pct=Math.round(score/Q.length*100),pass=pct>85;done=true;preparePDF(name,id,score,pct,pass,wrong);let r=document.getElementById('result');r.className='result '+(pass?'pass':'fail');r.innerHTML='<h2>'+(auto?'HẾT GIỜ - BÀI ĐÃ NỘP':'KẾT QUẢ')+'</h2><b>'+esc(name)+' • '+esc(id)+'</b><h2>'+score+'/'+Q.length+' • '+pct+'% • '+(pass?'PASS':'FAIL')+'</h2><div><b>Chi tiết câu sai/chưa trả lời:</b></div><div>'+((wrong.length)?wrong.map(function(n){var x=Q[n-1];var sel=document.querySelector('input[name=q'+(n-1)+']:checked');var chosen=sel?sel.value:'Chưa trả lời';var idx='ABCD'.indexOf(x.a);return '<div style="margin:8px 0;padding:10px;background:#fff;border-left:4px solid #d9363e"><b>Câu '+n+': SAI</b><br>Lựa chọn của bạn: '+esc(chosen)+'<br><b>Đáp án đúng: '+esc(x.a+'. '+x.o[idx])+'</b></div>';}).join(''):'<div>Không có câu sai.</div>')+'</div><div class="note">CSV đã tự tải xuống. Chọn LƯU PDF để lưu chi tiết 20 câu. Sau đó chọn GỬI KẾT QUẢ VÀO HỆ THỐNG để mở SharePoint Form và Submit kết quả; có thể dùng Gmail để gửi PDF nếu cần.</div><button id="again">TẢI LẠI CSV</button><button class="pdf" id="pdf">LƯU PDF</button><button id="mail">GỬI KẾT QUẢ QUA GMAIL</button><button id="system" style="background:#6b21a8">GỬI KẾT QUẢ VÀO HỆ THỐNG</button>';document.getElementById('again').onclick=()=>csv(name,id,score,pct,pass,wrong);document.getElementById('pdf').onclick=savePDF;document.getElementById('system').onclick=()=>{window.open('https://sonova-my.sharepoint.com/:l:/p/anhphuong_mai/JABVRNlgFfWHQZLcIw7OPxj8AUPcPuOdNZe7LuX4edmpHXM?nav=ZmMwMmQyOTMtM2E5YS00NmM1LWI3NDgtMGQ4YWVjN2RmNjQz','_blank','noopener,noreferrer')};document.getElementById('mail').onclick=()=>{let subject=encodeURIComponent('FG Warehouse Test - '+name+' - Bộ D - '+(pass?'PASS':'FAIL'));let body=encodeURIComponent('FG WAREHOUSE ONLINE TEST\n\nEmployee Name: '+name+'\nEmployee ID: '+id+'\nExam Set: A\nScore: '+score+' / '+Q.length+'\nPercentage: '+pct+'%\nResult: '+(pass?'PASS':'FAIL')+'\nSubmitted At: '+new Date().toLocaleString('vi-VN'));window.location.href='mailto:anhphuong82.mai@gmail.com?subject='+subject+'&body='+body};csv(name,id,score,pct,pass,wrong);r.scrollIntoView({behavior:'smooth'})}document.getElementById('submit').onclick=()=>submit(false);
</script></body></html>
