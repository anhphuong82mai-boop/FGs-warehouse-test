<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FG Warehouse Online Test</title><style>
body{font-family:Arial;margin:0;background:#edf2f7;color:#17202a}.app{max-width:1000px;margin:auto;background:white}header{background:#11283d;color:white;padding:22px}h1{margin:0}.bar{background:#16824b;color:white;padding:10px 22px;font-weight:bold}main{padding:20px}.meta{display:grid;grid-template-columns:2fr 1fr 1fr;gap:12px}input,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #9aa9b8;border-radius:6px}.q{border:1px solid #d7dee7;border-radius:9px;padding:15px;margin:12px 0}label.opt{display:block;padding:8px}.timer{float:right;background:#d9363e;padding:9px 15px;border-radius:8px;font-size:24px}button{padding:12px 18px;border:0;border-radius:7px;background:#155eaa;color:white;font-weight:bold;margin:8px;cursor:pointer}.pdf{background:#b42318}.result{padding:18px;border:2px solid;margin-top:16px;border-radius:8px}.pass{border-color:#16824b;background:#edfff4}.fail{border-color:#d9363e;background:#fff1f2}.note{background:#eef5ff;padding:10px;border-radius:7px;margin-top:10px}.print-sheet{display:none}
@media(max-width:700px){.meta{grid-template-columns:1fr}}
@media print{@page{size:A4;margin:15mm}body{background:#fff}.app{display:none!important}.print-sheet{display:block!important;color:#111;font-family:Arial}.print-title{text-align:center;border-bottom:3px solid #11283d;padding-bottom:12px;margin-bottom:18px}.print-title h1{font-size:22px}.print-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px 26px;font-size:13px}.print-result{margin:18px 0;padding:16px;border:2px solid #222;text-align:center;font-size:21px;font-weight:bold}.print-row{margin:9px 0;font-size:13px}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:80px;margin-top:55px;text-align:center;font-size:13px}.no-print{display:none!important}}
</style></head><body><div class="app"><header><div class="timer" id="timer">20:00</div><h1>FG WAREHOUSE ONLINE TEST - BỘ C</h1><div>WI-144 Receiving & Delivering Process at FGs WH<br>WI-779 Labeling as per customer requirement<br>WI-773 Checking Packaging and Exporting Finished Goods</div></header><div class="bar">20 phút • 1 đáp án/câu • PASS ≥ 80%</div><main><div class="meta"><input id="name" placeholder="Họ và tên"><input id="id" placeholder="Mã nhân viên"><input id="date" type="date"></div><div id="qs"></div><div style="text-align:center"><button id="submit">NỘP BÀI</button></div><div id="result"></div></main></div><section class="print-sheet" id="printSheet"></section><script>
const Q=[{"q":"Khi nhận hàng từ khu vực sản xuất xong thì nhân viên kho phải làm gì?","o":["Lưu trữ ở nhiều kệ khác nhau miễn là còn chỗ trống","Lưu trữ nhiều mã khác nhau tại cùng một vị trí và không cần định danh mã sản phẩm","Lưu trữ đúng kệ đã set up trước đó và có định danh rõ ràng cho từng mã sản phẩm","Không cần phải để vật tư vào kệ"],"a":"C"},{"q":"Nhóm sản phẩm nào của khách hàng US cần dán nhãn Made in Vietnam?","o":["Nhóm sản phẩm BTE 050*","Nhóm sản phẩm xR 054*","Nhóm sản phẩm FM 076*, 119*, 075*","Đáp án A và C"],"a":"D"},{"q":"Khi có sai lệch số lượng so với picking list thì nhóm packer cần phải làm gì?","o":["Tự vào kệ lấy thêm số lượng cho đúng với packing list","Không cần thông tin lại và bỏ hàng vào thùng","Thông tin lại nhóm picker kiểm tra việc dư/thiếu; chỉ tiếp tục đóng hàng sau khi có xác nhận","Cả A, B, C đều đúng"],"a":"C"},{"q":"Những khách hàng nào cần quấn màng co từng thùng carton?","o":["Sonova Polska Sp. z o.o.","Sonova AG (1500) / DC","Sonova Hearing India Pvt. Ltd.","Đáp án A và C"],"a":"D"},{"q":"Forwarder UPS cần những loại nhãn nào khi xuất đi?","o":["Must Go","Critical","Đáp án A và B đều đúng","Đáp án A và B đều sai"],"a":"C"},{"q":"Sau khi kiểm tra hàng đầy đủ, hàng sẽ được chất lên kệ và lấy ra kệ như thế nào?","o":["Chất vào bên phải, lấy ra bên trái","Chất vào bên trong, lấy ra bên ngoài","Chất vào bên dưới, lấy ra bên trên","Tất cả các câu trên đều đúng"],"a":"D"},{"q":"Trong SAP có T-code ZMOB - Mobile Data Maintenance Phonak, cần chọn Group HU nào?","o":["Pick direct","Pick selection","Load direct","Correct HU"],"a":"A"},{"q":"Để Goods Receipt order, vào transaction nào sau đây?","o":["MMBE","SQ01","MIGO","VL02L"],"a":"C"},{"q":"Tài liệu nào có liên quan đến WI ở kho?","o":["SOP-164 Material-Finished Goods Handling and Storage","WI-144 Receiving and Delivering Process at FGs WH","WI-262 Murphy to pick and pack materials and FGs","WI-779 Labeling as per customer requirement","Tất cả các câu trên đều đúng"],"a":"E"},{"q":"Đối với sản phẩm có serial number trên hộp thì phải quét Murphy như thế nào?","o":["Quét tên sản phẩm và serial number từ số nhỏ đến số lớn","Quét tên sản phẩm và serial number từ số lớn đến số nhỏ","Chỉ quét tên sản phẩm","Chỉ quét số nhỏ, không quét số lớn"],"a":"A"},{"q":"Chọn câu trả lời không đúng trong quy trình Pick tại kho thành phẩm.","o":["Picker soạn hàng dựa theo picking list in từ VL06L","Picker kiểm tra mã hàng hóa và số lượng theo picking list","Picker bảo đảm không có bất kỳ sai lệch nào","Được phép viết tay số lượng cho vật tư và thành phẩm đang lưu trữ","Picker soạn hàng dựa theo picking list in từ VL10"],"a":"D"},{"q":"Chọn câu trả lời không đúng trong quy trình Pack tại kho thành phẩm.","o":["Packer nhận hàng từ khu vực chờ trên trolley và quét mã delivery","Packer kiểm tra mã hàng hóa và số lượng theo packing list","Khi sai lệch, Packer phản hồi nhóm Picker và quản lý kho; Picker xử lý sai lệch","Nếu sản phẩm yêu cầu serial, Packer quét serial theo WI-262 mục 4.1.2","Packer không cần kiểm tra mã hàng hóa và số lượng theo packing list"],"a":"E"},{"q":"Quy trình nhận và lưu trữ hàng thành phẩm cần lưu ý gì trước khi Goods Receipt?","o":["Kiểm tra ngoại quan sản phẩm","Kiểm tra số lượng trên nhãn và thực tế","Kiểm tra FIFO","Tất cả các câu trên đều đúng"],"a":"D"},{"q":"Những khách hàng/nước nào cần dán nhãn Made in VN?","o":["Advanced Bionics LLC (AB-LLC)","Sonova Duyu Sistemleri (Turkey)","Sonova USA (AODC)","Tất cả các câu trên đều đúng"],"a":"D"},{"q":"Pin Lithium-ion chứa trong thiết bị, hoặc đi kèm thiết bị được mô tả trên SAP là label gì?","o":["Label UN 3480","Label UN 3481","Label UN 3091"],"a":"B"},{"q":"Pin Lithium-ion riêng lẻ, không đi cùng hoặc không chứa trong thiết bị, được mô tả trên SAP là label gì?","o":["Label UN 3480","Label UN 3481","Label UN 3091"],"a":"A"},{"q":"Các thùng đóng gói Pin UN 3480 sử dụng thùng shipping box 5 lớp và cần dán bao nhiêu nhãn trước khi xuất?","o":["4 nhãn","5 nhãn","1 nhãn"],"a":"A"},{"q":"PharmaCools Gel Packs phải được ủ ở 20°C ±5°C ít nhất bao nhiêu giờ trước khi đóng gói cho Lyric?","o":["Ít nhất 52 giờ","Ít nhất 62 giờ","Ít nhất 72 giờ"],"a":"C"},{"q":"Nhân viên kho khi dán AWB cần chú ý những điều kiện gì?","o":["Đúng số Group","Đúng tên khách hàng","Đúng số kiện trên AWB","Tất cả các câu trên đều đúng"],"a":"D"},{"q":"Những khách hàng hoặc nước nào sau đây cần dán nhãn Made in VN?","o":["Sonova do Brasil Produtos Audiologi (BZ)","Sonova Duyu Sistemleri (Turkey)","Sonova USA (AODC)","Tất cả các câu trên đều đúng"],"a":"D"}];const box=document.getElementById('qs');Q.forEach((x,i)=>{let d=document.createElement('div');d.className='q';d.innerHTML='<b>Câu '+(i+1)+'. '+x.q+'</b>'+x.o.map((z,j)=>'<label class="opt"><input type="radio" name="q'+i+'" value="'+String.fromCharCode(65+j)+'"> '+String.fromCharCode(65+j)+'. '+z+'</label>').join('');box.appendChild(d)});document.getElementById('date').value=new Date().toISOString().slice(0,10);let sec=1200,done=false;setInterval(()=>{if(done)return;if(--sec<0)return;document.getElementById('timer').textContent=String(Math.floor(sec/60)).padStart(2,'0')+':'+String(sec%60).padStart(2,'0');if(sec===0)submit(true)},1000);
const esc=v=>String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function csv(name,id,score,pct,pass,wrong){const now=new Date(),pad=n=>String(n).padStart(2,'0'),stamp=`${now.getFullYear()}${pad(now.getMonth()+1)}${pad(now.getDate())}_${pad(now.getHours())}${pad(now.getMinutes())}${pad(now.getSeconds())}`,e=v=>'"'+String(v).replace(/"/g,'""')+'"';let row=['Employee Name','Employee ID','Exam Name','Test Date','Submitted At','Score','Total MCQ','Percentage','Result','Wrong Questions'].join(',')+'\n'+[e(name),e(id),e('WI-144 & WI-779 & WI-773 - BỘ C'),e(document.getElementById('date').value),e(now.toLocaleString('vi-VN')),score,Q.length,pct,e(pass?'PASS':'FAIL'),e(wrong.join('; '))].join(',');let b=new Blob(['﻿'+row],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`FG_Test_${id}_${stamp}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function preparePDF(name,id,score,pct,pass,wrong){
 const now=new Date(),date=document.getElementById('date').value,letters=['A','B','C','D'];
 let details=Q.map((x,i)=>{
  const selected=document.querySelector('input[name=q'+i+']:checked');
  const chosen=selected?selected.value:'';
  const chosenIndex=letters.indexOf(chosen),correctIndex=letters.indexOf(x.a);
  const chosenText=chosenIndex>=0?chosen+'. '+x.o[chosenIndex]:'Chưa trả lời';
  const correctText=correctIndex>=0?x.a+'. '+x.o[correctIndex]:x.a;
  const ok=chosen===x.a;
  return `<div style="margin:12px 0;padding:10px;border:1px solid #bbb;border-radius:6px;page-break-inside:avoid">
   <div style="font-weight:700">Câu ${i+1}: ${esc(x.q)}</div>
   <div><b>Nhân viên chọn:</b> ${esc(chosenText)}</div>
   <div><b>Đáp án đúng:</b> ${esc(correctText)}</div>
   <div><b>Kết quả:</b> ${ok?'ĐÚNG':'SAI'}</div>
  </div>`
 }).join('');
 document.getElementById('printSheet').innerHTML=`<div class="print-title"><h1>FG WAREHOUSE - PHIẾU KẾT QUẢ KIỂM TRA</h1><div>WI-144 Receiving & Delivering Process at FGs WH</div><div>WI-779 Labeling as per customer requirement<br>WI-773 Checking Packaging and Exporting Finished Goods</div></div><div class="print-grid"><div><b>Họ và tên:</b> ${esc(name)}</div><div><b>Mã nhân viên:</b> ${esc(id)}</div><div><b>Ngày kiểm tra:</b> ${esc(date)}</div><div><b>Thời gian nộp:</b> ${esc(now.toLocaleString('vi-VN'))}</div></div><div class="print-result">${score}/${Q.length} câu &nbsp; | &nbsp; ${pct}% &nbsp; | &nbsp; ${pass?'PASS':'FAIL'}</div><div class="print-row"><b>Ngưỡng đạt:</b> 80%</div><div class="print-row"><b>Câu sai/chưa trả lời:</b> ${wrong.length?wrong.join(', '):'Không có'}</div><h2 style="margin-top:22px">CHI TIẾT 20 CÂU HỎI VÀ CÂU TRẢ LỜI</h2>${details}<div class="signatures"><div>Nhân viên<br><br><br>________________________</div><div>Người xác nhận<br><br><br>________________________</div></div>`
}
function savePDF(){window.print()}
function submit(auto=false){if(done)return;let name=document.getElementById('name').value.trim(),id=document.getElementById('id').value.trim();if(!name||!id){alert('Vui lòng nhập Họ tên và Mã nhân viên');return}let score=0,wrong=[];Q.forEach((x,i)=>{let s=document.querySelector('input[name=q'+i+']:checked');if(s&&s.value===x.a)score++;else wrong.push(i+1)});let pct=Math.round(score/Q.length*100),pass=pct>=80;done=true;preparePDF(name,id,score,pct,pass,wrong);let r=document.getElementById('result');r.className='result '+(pass?'pass':'fail');r.innerHTML='<h2>'+(auto?'HẾT GIỜ - BÀI ĐÃ NỘP':'KẾT QUẢ')+'</h2><b>'+esc(name)+' • '+esc(id)+'</b><h2>'+score+'/'+Q.length+' • '+pct+'% • '+(pass?'PASS':'FAIL')+'</h2><div>Câu sai/chưa trả lời: '+(wrong.join(', ')||'Không có')+'</div><div class="note">CSV đã tự tải xuống. Chọn LƯU PDF để lưu PDF có đầy đủ 20 câu hỏi và câu trả lời; sau đó đính kèm PDF vào Gmail trước khi gửi.</div><button id="again">TẢI LẠI CSV</button><button class="pdf" id="pdf">LƯU PDF</button><button id="mail">GỬI KẾT QUẢ QUA GMAIL</button>';document.getElementById('again').onclick=()=>csv(name,id,score,pct,pass,wrong);document.getElementById('pdf').onclick=savePDF;document.getElementById('mail').onclick=()=>{let subject=encodeURIComponent('FG Warehouse Test - '+name+' - Bộ C - '+(pass?'PASS':'FAIL'));let body=encodeURIComponent('FG WAREHOUSE ONLINE TEST\n\nEmployee Name: '+name+'\nEmployee ID: '+id+'\nExam Set: C\nScore: '+score+' / '+Q.length+'\nPercentage: '+pct+'%\nResult: '+(pass?'PASS':'FAIL')+'\nSubmitted At: '+new Date().toLocaleString('vi-VN'));window.location.href='mailto:anhphuong82.mai@gmail.com?subject='+subject+'&body='+body};csv(name,id,score,pct,pass,wrong);r.scrollIntoView({behavior:'smooth'})}document.getElementById('submit').onclick=()=>submit(false);
</script></body></html>
